[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-authenticity-prediction"
version = "0.1.0"
description = "Deep learning models and explainability tools for image authenticity prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "torchaudio>=0.10.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pillow>=8.3.0",
    "pyyaml>=5.4.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "colorama>=0.4.4",
    "tqdm>=4.62.0",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "scikit-image>=0.18.0",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "nbformat>=5.0.0",
    "nbconvert>=7.0.0",
]

[project.scripts]
image-authenticity = "Image_Authenticity_prediction.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Image_Authenticity_prediction*"]
exclude = ["Image_Authenticity_prediction.Dataset*", "Image_Authenticity_prediction.Outputs*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as requiring GPU",
]
